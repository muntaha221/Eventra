<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; padding: 40px 20px; margin: 0;">
    <div style="max-width: 560px; margin: 0 auto; background: #141414; border: 1px solid #262626; border-radius: 14px; padding: 36px;">
        <h2 style="color: #22c55e; margin-top: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">{{appName}}</h2>
        <h1 style="color: #ffffff; font-size: 20px; margin-bottom: 16px;">Reset your password</h1>
        <p style="color: #a3a3a3; font-size: 15px; line-height: 1.6;">Hi {{name}},</p>
        <p style="color: #a3a3a3; font-size: 15px; line-height: 1.6;">We received a request to reset your password. Click the button below to set a new one:</p>
        <div style="margin: 30px 0;">
            <a href="{{resetUrl}}" style="background: #22c55e; color: #052e16; font-weight: 700; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-block; font-size: 14px;">Reset Password</a>
        </div>
        <p style="color: #737373; font-size: 13px; line-height: 1.5;">This link will expire in 1 hour.<br>Link: <a href="{{resetUrl}}" style="color: #4ade80;">{{resetUrl}}</a></p>
        <hr style="border: none; border-top: 1px solid #262626; margin: 30px 0;">
        <p style="color: #525252; font-size: 12px; margin: 0;">If you didn't request a password reset, you can safely ignore this email.</p>
    </div>
</body>
</html>
