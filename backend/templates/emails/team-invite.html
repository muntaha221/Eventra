<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Team Invitation</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; padding: 40px 20px; margin: 0;">
    <div style="max-width: 560px; margin: 0 auto; background: #141414; border: 1px solid #262626; border-radius: 14px; padding: 36px;">
        <h2 style="color: #22c55e; margin-top: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">{{appName}}</h2>
        <h1 style="color: #ffffff; font-size: 20px; margin-bottom: 16px;">You're invited to join {{orgName}}</h1>
        <p style="color: #a3a3a3; font-size: 15px; line-height: 1.6;">Hello,</p>
        <p style="color: #a3a3a3; font-size: 15px; line-height: 1.6;"><strong style="color: #ffffff;">{{inviterName}}</strong> has invited you to join <strong style="color: #4ade80;">{{orgName}}</strong> on {{appName}} as a team member.</p>
        <div style="margin: 30px 0;">
            <a href="{{inviteUrl}}" style="background: #22c55e; color: #052e16; font-weight: 700; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-block; font-size: 14px;">Accept Invitation</a>
        </div>
        <p style="color: #737373; font-size: 13px; line-height: 1.5;">This invite link is valid for 7 days.<br>Link: <a href="{{inviteUrl}}" style="color: #4ade80;">{{inviteUrl}}</a></p>
        <hr style="border: none; border-top: 1px solid #262626; margin: 30px 0;">
        <p style="color: #525252; font-size: 12px; margin: 0;">If you were not expecting this invitation, you can ignore this email.</p>
    </div>
</body>
</html>
