<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Welcome</title></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; padding: 40px 20px; margin: 0;">
    <div style="max-width: 560px; margin: 0 auto; background: #141414; border: 1px solid #262626; border-radius: 14px; padding: 36px;">
        <h2 style="color: #22c55e; margin-top: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;">{{appName}}</h2>
        <h1 style="color: #ffffff; font-size: 20px; margin-bottom: 16px;">Welcome, {{name}}</h1>
        <p style="color: #a3a3a3; font-size: 15px; line-height: 1.6;">Thank you for registering with <strong>{{appName}}</strong>.</p>
        <p style="color: #a3a3a3; font-size: 15px; line-height: 1.6;">You can now organize events, manage ticketing, and invite your team members.</p>
        <hr style="border: none; border-top: 1px solid #262626; margin: 30px 0;">
        <p style="color: #525252; font-size: 12px; margin: 0;">&copy; 2026 {{appName}}. All rights reserved.</p>
    </div>
</body>
</html>
